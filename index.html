<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Visual Production Cost Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { background: #f6f7f9; }
    .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .num-input { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------------------------------------------------------------------------
   Defaults (persisted config). Structured so margin/pricing logic can be
   layered on later without restructuring the cost engine.

   Phase billing flags:
   - packageScoped : campaign mode → once per package; per-visual mode → tidak dihitung
   - perImage      : always per image (every visual)
   - hiresOnly     : per Hires image only
--------------------------------------------------------------------------- */
const DEFAULT_CONFIG = {
  usd_to_idr: 18000,
  price_buffer_multiplier: 1.5,
  base_hourly_rate_idr: 50000,
  rate_selection: "max_of_mean_median",
  campaign_package_size: 10,
  engines: {
    generating: [
      { name: "Grok", usd: 0.020 },
      { name: "Grok Quality", usd: 0.060 },
      { name: "Nano Banana 2", usd: 0.070 },
      { name: "Nano Banana Pro", usd: 0.150 },
      { name: "Flux 2 Pro", usd: 0.090 },
      { name: "Flux 2 Max", usd: 0.100 },
      { name: "Seedream 4.5", usd: 0.040 },
      { name: "GPT 2 (composite)", usd: 0.089 },
    ],
    upscaling: [
      { name: "Crystal Upscaler", usd: 0.825 },
      { name: "Clarity Pro", usd: 1.055 },
    ],
  },
  phases: [
    { id: "creative",  name: "Creative Conception", genMin: 100, genMax: 250, group: "generating", hrsMin: 4,  hrsMax: 10, hourlyMult: 1.25, packageScoped: true },
    { id: "revision",  name: "Concept Revision",    genMin: 50,  genMax: 125, group: "generating", hrsMin: 8,  hrsMax: 12, hourlyMult: 1.00, packageScoped: true },
    { id: "prompting", name: "Prompting Day",       genMin: 200, genMax: 400, group: "generating", hrsMin: 4,  hrsMax: 10, hourlyMult: 1.00, perImage: true },
    { id: "touchup",   name: "Touch Up / Upscale",  genMin: 100, genMax: 300, group: "upscaling",  hrsMin: 10, hrsMax: 10, hourlyMult: 1.00, hiresOnly: true },
  ],
};

const CONFIG_KEY = "aier_cost_config_v2";

/* ---------------------------------------------------------------------------
   Helpers — NO rounding of intermediate values. Round only at display.
--------------------------------------------------------------------------- */
const idr = (n) => "Rp" + Math.round(n).toLocaleString("id-ID");
const usd3 = (n) => "$" + Number(n).toFixed(3);
const pct = (n) => (n * 100).toFixed(1) + "%";

function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// mean vs median → use the higher (rate_selection = max_of_mean_median)
function deriveRate(engines) {
  const vals = engines.map((e) => Number(e.usd)).filter((v) => v > 0);
  if (!vals.length) return { mean: 0, median: 0, selected: 0, which: "—" };
  const mn = mean(vals), md = median(vals);
  const selected = Math.max(mn, md);
  const which = mn === md ? "equal" : (selected === md ? "median" : "mean");
  return { mean: mn, median: md, selected, which };
}

const midpoint = (a, b) => (a + b) / 2;
function pick(scenario, min, max) {
  if (scenario === "min") return min;
  if (scenario === "max") return max;
  return midpoint(min, max); // avg
}

/* ---------------------------------------------------------------------------
   Core engine.
   mode "full" + scope "per_visual": every image = prompting only (per image);
       Touch Up/Upscale per Hires image. Creative Conception & Concept Revision
       tidak dihitung sama sekali di scope ini.
   mode "full" + scope "campaign": 1 package = up to `package_size` images.
       Each package has 1× creative + 1× revision. Prompting is per image (N).
       packages = ceil(N / package_size). Touch Up/Upscale per Hires image.
   mode "upscale": upscale-only package — only the upscaling phase, per image.
--------------------------------------------------------------------------- */
function computeScenario(cfg, rt, rates, scenario) {
  const genRate = rates.generating.selected * cfg.usd_to_idr;
  const upsRate = rates.upscaling.selected * cfg.usd_to_idr;
  const N = Math.max(1, rt.N);
  const upscaleOnly = rt.mode === "upscale";
  const campaignMode = !upscaleOnly && rt.scopeMode === "campaign";
  const packageSize = Math.max(1, Math.floor(cfg.campaign_package_size || 10));
  const packages = Math.ceil(N / packageSize);
  const hiresN = upscaleOnly ? N : Math.min(Math.max(0, rt.hiresN), N);

  let total_machine = 0, total_labor = 0, packagePart = 0, perImagePart = 0;
  const rows = [];

  cfg.phases.forEach((p) => {
    if (upscaleOnly && p.group !== "upscaling") return;
    // Per-visual scope hanya menghitung Prompting Day + Touch Up/Upscale (beserta
    // labor-nya). Fase package-scoped (Creative Conception & Concept Revision)
    // eksklusif untuk mode campaign.
    if (!upscaleOnly && !campaignMode && p.packageScoped) return;

    const gen = pick(scenario, p.genMin, p.genMax);
    const hrs = pick(scenario, p.hrsMin, p.hrsMax);
    const rate = p.group === "generating" ? genRate : p.group === "upscaling" ? upsRate : 0;
    const machine = gen * rate;
    const labor = hrs * cfg.base_hourly_rate_idr * p.hourlyMult;
    const unit = machine + labor;

    let bucket, appliedN;
    if (upscaleOnly) {
      bucket = "per_image"; appliedN = N;
    } else if (p.hiresOnly) {
      bucket = "hires"; appliedN = hiresN;
    } else if (p.perImage) {
      bucket = "per_visual"; appliedN = N;
    } else if (p.packageScoped && campaignMode) {
      bucket = "package"; appliedN = packages;
    } else {
      bucket = "per_visual"; appliedN = N;
    }

    const contribM = machine * appliedN;
    const contribL = labor * appliedN;
    total_machine += contribM;
    total_labor += contribL;
    if (bucket === "package") packagePart += contribM + contribL;
    else perImagePart += contribM + contribL;

    rows.push({ id: p.id, name: p.name, group: p.group, bucket, appliedN,
      gen, hrs, rate, machine, labor, subtotalOnce: unit, scaledSubtotal: unit * appliedN });
  });

  const total_internal = total_machine + total_labor;
  const cost_per_unit = total_internal / N;
  const phaseRows = rows.map((r) => ({ ...r, pctOfTotal: total_internal ? r.scaledSubtotal / total_internal : 0 }));

  return {
    N, hiresN, lowresN: N - hiresN, upscaleOnly, campaignMode, packages, packageSize,
    genRate, upsRate, total_machine, total_labor, total_internal, cost_per_unit,
    packagePart, perImagePart, phaseRows,
  };
}

/* ---------------------------------------------------------------------------
   UI atoms
--------------------------------------------------------------------------- */
function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="text-xs font-medium text-slate-600">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-slate-400 mt-0.5">{hint}</span>}
    </label>
  );
}

function NumInput({ value, onChange, step = 1, min, className = "" }) {
  return (
    <input type="number" value={value} step={step} min={min}
      onChange={(e) => onChange(e.target.value === "" ? "" : Number(e.target.value))}
      className={"num-input mt-1 w-full rounded-md border border-slate-300 px-2.5 py-1.5 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none " + className} />
  );
}

function Segmented({ value, onChange, options }) {
  return (
    <div className="mt-1 grid gap-1 rounded-md bg-slate-100 p-1" style={{ gridTemplateColumns: `repeat(${options.length},1fr)` }}>
      {options.map(([v, l]) => (
        <button key={v} onClick={() => onChange(v)}
          className={"rounded px-2 py-1.5 text-xs font-medium " + (value === v ? "bg-white text-indigo-600 shadow-sm" : "text-slate-500")}>{l}</button>
      ))}
    </div>
  );
}

function Section({ title, children, defaultOpen = false, note }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="rounded-lg border border-slate-200 bg-white">
      <button onClick={() => setOpen(!open)} className="flex w-full items-center justify-between px-4 py-3">
        <span className="text-sm font-semibold text-slate-700">{title}</span>
        <span className="text-slate-400 text-xs">{open ? "▲ tutup" : "▼ buka"}</span>
      </button>
      {note && !open && <p className="px-4 pb-3 -mt-1 text-[11px] text-slate-400">{note}</p>}
      {open && <div className="border-t border-slate-100 p-4">{children}</div>}
    </div>
  );
}

function Bar({ a, b, aLabel, bLabel, aColor, bColor }) {
  const total = a + b || 1;
  const pa = (a / total) * 100;
  return (
    <div>
      <div className="flex h-6 w-full overflow-hidden rounded-md">
        <div style={{ width: pa + "%" }} className={aColor} />
        <div style={{ width: (100 - pa) + "%" }} className={bColor} />
      </div>
      <div className="mt-1 flex justify-between text-[11px] text-slate-500">
        <span>{aLabel}: {idr(a)} ({pct(a / total)})</span>
        <span>{bLabel}: {idr(b)} ({pct(b / total)})</span>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Root
--------------------------------------------------------------------------- */
function App() {
  const [config, setConfig] = useState(() => {
    try {
      const saved = localStorage.getItem(CONFIG_KEY);
      if (saved) return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
    } catch (e) {}
    return DEFAULT_CONFIG;
  });

  // Session inputs (NOT persisted)
  const [rt, setRt] = useState({
    mode: "full",           // full | upscale
    scopeMode: "per_visual", // per_visual | campaign  (full mode only)
    N: 10,
    hiresN: 2,
    projectName: "",
  });

  const [bdScenario, setBdScenario] = useState("avg");
  const [sortByPct, setSortByPct] = useState(true);

  useEffect(() => { try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) {} }, [config]);

  const rates = useMemo(() => ({
    generating: deriveRate(config.engines.generating),
    upscaling: deriveRate(config.engines.upscaling),
  }), [config.engines]);

  const results = useMemo(() => ({
    min: computeScenario(config, rt, rates, "min"),
    avg: computeScenario(config, rt, rates, "avg"),
    max: computeScenario(config, rt, rates, "max"),
  }), [config, rt, rates]);

  const upscaleOnly = rt.mode === "upscale";
  const campaignMode = !upscaleOnly && rt.scopeMode === "campaign";
  const unitLabel = upscaleOnly ? "gambar" : "visual";
  const avg = results.avg;

  const warnings = useMemo(() => {
    const w = [];
    if (rt.N < 1) w.push(`Jumlah ${unitLabel} harus ≥ 1.`);
    if (!upscaleOnly && rt.hiresN > rt.N) w.push("Jumlah Hires melebihi N — dibatasi otomatis ke N.");
    [...config.engines.generating, ...config.engines.upscaling].forEach((e) => {
      if (!(Number(e.usd) > 0)) w.push(`Rate engine "${e.name}" harus > 0.`);
    });
    config.phases.forEach((p) => {
      if (p.genMin > p.genMax) w.push(`${p.name}: generate min > max.`);
      if (p.hrsMin > p.hrsMax) w.push(`${p.name}: jam min > max.`);
    });
    if (!(config.base_hourly_rate_idr > 0)) w.push("Base hourly rate harus > 0.");
    if (!(config.price_buffer_multiplier > 0)) w.push("Buffer multiplier harus > 0.");
    if (!(config.campaign_package_size >= 1)) w.push("Maks image per paket harus ≥ 1.");
    return w;
  }, [config, rt, upscaleOnly, unitLabel]);

  /* config editing */
  const setCfg = (patch) => setConfig((c) => ({ ...c, ...patch }));
  const setEngine = (group, i, usd) => setConfig((c) => ({ ...c, engines: { ...c.engines, [group]: c.engines[group].map((e, j) => j === i ? { ...e, usd } : e) } }));
  const setEngineName = (group, i, name) => setConfig((c) => ({ ...c, engines: { ...c.engines, [group]: c.engines[group].map((e, j) => j === i ? { ...e, name } : e) } }));
  const addEngine = (group) => setConfig((c) => ({ ...c, engines: { ...c.engines, [group]: [...c.engines[group], { name: "Engine baru", usd: 0.05 }] } }));
  const removeEngine = (group, i) => setConfig((c) => ({ ...c, engines: { ...c.engines, [group]: c.engines[group].filter((_, j) => j !== i) } }));
  const setPhase = (i, patch) => setConfig((c) => ({ ...c, phases: c.phases.map((p, j) => j === i ? { ...p, ...patch } : p) }));
  const resetConfig = () => { if (confirm("Reset semua konfigurasi ke default?")) setConfig(DEFAULT_CONFIG); };

  const buffer = config.price_buffer_multiplier;

  /* PDF export */
  const exportPDF = () => {
    if (!window.jspdf || !window.jspdf.jsPDF) { alert("Library PDF belum termuat. Coba muat ulang halaman."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const name = (rt.projectName || "").trim() || "Cost Calculation";
    const r = results[bdScenario];
    let y = 48;

    doc.setFontSize(16); doc.setFont(undefined, "bold");
    doc.text(name, 40, y); y += 18;
    doc.setFontSize(9); doc.setFont(undefined, "normal"); doc.setTextColor(120);
    doc.text(`AI Visual Production Cost — biaya internal v1 · ${new Date().toLocaleString("id-ID")}`, 40, y);
    doc.setTextColor(0); y += 22;

    const setupTxt = upscaleOnly
      ? `Mode: Upscale only · ${rt.N} gambar · skenario ${bdScenario}`
      : campaignMode
        ? `Mode: Campaign · N=${rt.N} → ${avg.packages} paket (maks ${avg.packageSize}/paket) · ${avg.hiresN} Hires / ${avg.lowresN} Lowres · skenario ${bdScenario}`
        : `Mode: Per-visual · N=${rt.N} (${avg.hiresN} Hires / ${avg.lowresN} Lowres) · skenario ${bdScenario}`;
    doc.setFontSize(10); doc.setFont(undefined, "bold");
    doc.text(setupTxt, 40, y); y += 8;

    doc.autoTable({
      startY: y + 6,
      head: [["Ringkasan", "Nilai"]],
      body: [
        ["Total internal (min / avg / max)", `${idr(results.min.total_internal)}  /  ${idr(results.avg.total_internal)}  /  ${idr(results.max.total_internal)}`],
        [`Cost per ${unitLabel} (avg)`, idr(results.avg.cost_per_unit)],
        [`Buffered x${buffer} (avg)`, idr(results.avg.total_internal * buffer)],
        ["Rate generating / upscaling", `${idr(results.avg.genRate)}  /  ${idr(results.avg.upsRate)} per generate`],
      ],
      theme: "grid", styles: { fontSize: 9, cellPadding: 5 },
      headStyles: { fillColor: [79, 70, 229] },
      columnStyles: { 0: { cellWidth: 200 } },
      margin: { left: 40, right: 40 },
    });

    const badge = (p) => p.bucket === "package" ? `paket x${p.appliedN}`
      : p.bucket === "hires" ? `hires x${p.appliedN}`
      : p.bucket === "per_image" ? `per-gambar x${p.appliedN}` : `per-visual x${p.appliedN}`;

    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 16,
      head: [["Fase", "Scope", "Generates", "Machine", "Jam", "Labor", "Subtotal", "% total"]],
      body: r.phaseRows.map((p) => [
        p.name, badge(p),
        p.gen ? Math.round(p.gen).toLocaleString("id-ID") : "-",
        p.machine ? idr(p.machine) : "-",
        p.hrs || "-",
        p.labor ? idr(p.labor) : "-",
        idr(p.scaledSubtotal),
        pct(p.pctOfTotal),
      ]),
      foot: [["TOTAL INTERNAL", "", "", idr(r.total_machine), "", idr(r.total_labor), idr(r.total_internal), "100%"]],
      theme: "grid", styles: { fontSize: 8.5, cellPadding: 4 },
      headStyles: { fillColor: [79, 70, 229] },
      footStyles: { fillColor: [241, 245, 249], textColor: 20, fontStyle: "bold" },
      margin: { left: 40, right: 40 },
    });

    const safe = name.replace(/[^\w\d-]+/g, "_").replace(/^_+|_+$/g, "") || "cost";
    doc.save(`${safe}-${bdScenario}-N${rt.N}.pdf`);
  };

  const bdResult = results[bdScenario];
  const bdRows = useMemo(() => {
    const rows = [...bdResult.phaseRows];
    if (sortByPct) rows.sort((a, b) => b.pctOfTotal - a.pctOfTotal);
    return rows;
  }, [bdResult, sortByPct]);

  const bucketBadge = (p) => {
    if (p.bucket === "package") return { txt: `paket ×${p.appliedN}`, cls: "bg-amber-100 text-amber-700" };
    if (p.bucket === "hires") return { txt: `hires ×${p.appliedN}`, cls: "bg-fuchsia-100 text-fuchsia-700" };
    if (p.bucket === "per_image") return { txt: `per-gambar ×${p.appliedN}`, cls: "bg-teal-100 text-teal-700" };
    return { txt: `per-visual ×${p.appliedN}`, cls: "bg-teal-100 text-teal-700" };
  };

  const headerSetup = upscaleOnly
    ? `${rt.N} gambar (upscale only)`
    : campaignMode
      ? `N=${rt.N} → ${avg.packages} paket (maks ${avg.packageSize}/paket) · ${avg.hiresN} Hires / ${avg.lowresN} Lowres`
      : `N=${rt.N} (${avg.hiresN} Hires / ${avg.lowresN} Lowres)`;

  return (
    <div className="mx-auto max-w-6xl px-4 py-6">
      <header className="mb-5">
        <h1 className="text-xl font-bold text-slate-800">AI Visual Production Cost Calculator</h1>
        <p className="text-sm text-slate-500">Biaya produksi internal — v1. Mesin (generates) & tenaga kerja (jam) dipisah.</p>
      </header>

      {warnings.length > 0 && (
        <div className="mb-4 rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
          <div className="font-semibold">Perhatian:</div>
          <ul className="list-disc pl-5">{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
        </div>
      )}

      <div className="grid grid-cols-1 gap-5 lg:grid-cols-[320px_1fr]">
        {/* ---------------- INPUTS ---------------- */}
        <div className="space-y-4">
          <div className="rounded-lg border border-slate-200 bg-white p-4 space-y-4">
            <Field label="Mode perhitungan">
              <Segmented value={rt.mode} onChange={(v) => setRt({ ...rt, mode: v })}
                options={[["full", "Full production"], ["upscale", "Upscale only"]]} />
            </Field>

            {!upscaleOnly && (
              <Field label="Struktur biaya (scope)"
                hint={campaignMode
                  ? "Campaign: tiap paket berisi 1× Creative + 1× Concept + Prompting per image."
                  : "Per-visual: tiap image hanya Prompting Day + Touch Up/Upscale (tanpa Creative & Concept)."}>
                <Segmented value={rt.scopeMode} onChange={(v) => setRt({ ...rt, scopeMode: v })}
                  options={[["per_visual", "Per-visual"], ["campaign", "Campaign"]]} />
              </Field>
            )}

            <Field label={upscaleOnly ? "Jumlah gambar (upscale)" : "Jumlah visual (N)"}
              hint={upscaleOnly ? "Paket upscaling saja — tanpa developing image."
                : campaignMode ? `→ ${avg.packages} paket (maks ${avg.packageSize} image / paket).` : undefined}>
              <NumInput value={rt.N} min={1}
                onChange={(v) => setRt((s) => { const N = v === "" ? 1 : Math.max(1, Math.floor(v)); return { ...s, N, hiresN: Math.min(s.hiresN, N) }; })} />
            </Field>

            {!upscaleOnly && (
              <Field label="Berapa yang Hires?" hint={`0–${rt.N}. Sisanya Lowres (tanpa Touch Up/Upscale). Saat ini: ${avg.hiresN} Hires · ${avg.lowresN} Lowres.`}>
                <NumInput value={rt.hiresN} min={0}
                  onChange={(v) => setRt((s) => ({ ...s, hiresN: v === "" ? 0 : Math.min(Math.max(0, Math.floor(v)), s.N) }))} />
              </Field>
            )}

            <button onClick={exportPDF} className="w-full rounded-md bg-indigo-600 py-2 text-sm font-semibold text-white hover:bg-indigo-700">⬇ Export PDF</button>
            <Field label="Nama proyek / campaign" hint="Muncul sebagai judul di PDF & nama file.">
              <input value={rt.projectName} onChange={(e) => setRt({ ...rt, projectName: e.target.value })}
                placeholder="mis. Campaign Ramadan 2026"
                className="mt-1 w-full rounded-md border border-slate-300 px-2.5 py-1.5 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
            </Field>
          </div>

          {/* Engine rates */}
          <Section title="Rate engine (USD/generate)" note="Mean vs median → yang lebih tinggi dipilih otomatis.">
            {["generating", "upscaling"].map((group) => {
              const r = rates[group];
              return (
                <div key={group} className="mb-4 last:mb-0">
                  <div className="mb-1 flex items-center justify-between">
                    <span className="text-xs font-semibold uppercase tracking-wide text-slate-500">{group}</span>
                    <button onClick={() => addEngine(group)} className="text-xs text-indigo-600">+ tambah</button>
                  </div>
                  <div className="space-y-1">
                    {config.engines[group].map((e, i) => (
                      <div key={i} className="flex items-center gap-1">
                        <input value={e.name} onChange={(ev) => setEngineName(group, i, ev.target.value)} className="flex-1 rounded border border-slate-200 px-2 py-1 text-xs" />
                        <input type="number" step="0.001" value={e.usd} onChange={(ev) => setEngine(group, i, Number(ev.target.value))} className="num-input w-20 rounded border border-slate-200 px-2 py-1 text-xs text-right" />
                        <button onClick={() => removeEngine(group, i)} className="px-1 text-slate-300 hover:text-red-500">✕</button>
                      </div>
                    ))}
                  </div>
                  <div className="mt-2 rounded bg-slate-50 p-2 text-[11px] text-slate-500">
                    mean {usd3(r.mean)} · median {usd3(r.median)} →
                    <span className="font-semibold text-slate-700"> {r.which === "equal" ? "sama" : `${r.which} dipilih`}</span> ·
                    <span className="font-semibold text-indigo-600"> {idr(r.selected * config.usd_to_idr)}/generate</span>
                  </div>
                </div>
              );
            })}
            <div className="mt-2 text-[11px] text-slate-400">Rasio upscaling ÷ generating ≈ {(rates.upscaling.selected / (rates.generating.selected || 1)).toFixed(1)}×</div>
          </Section>

          {/* Phase ranges */}
          <Section title="Range fase & multiplier">
            <div className="space-y-3">
              {config.phases.map((p, i) => (
                <div key={p.id} className="rounded-md border border-slate-100 p-2">
                  <div className="mb-1 text-xs font-semibold text-slate-700">{p.name}<span className="ml-1 font-normal text-slate-400">({p.group})</span></div>
                  <div className="grid grid-cols-2 gap-2">
                    <label className="text-[10px] text-slate-400">Gen min<NumInput value={p.genMin} onChange={(v) => setPhase(i, { genMin: v || 0 })} /></label>
                    <label className="text-[10px] text-slate-400">Gen max<NumInput value={p.genMax} onChange={(v) => setPhase(i, { genMax: v || 0 })} /></label>
                    <label className="text-[10px] text-slate-400">Jam min<NumInput value={p.hrsMin} step={0.5} onChange={(v) => setPhase(i, { hrsMin: v || 0 })} /></label>
                    <label className="text-[10px] text-slate-400">Jam max<NumInput value={p.hrsMax} step={0.5} onChange={(v) => setPhase(i, { hrsMax: v || 0 })} /></label>
                    <label className="col-span-2 text-[10px] text-slate-400">Hourly multiplier<NumInput value={p.hourlyMult} step={0.05} onChange={(v) => setPhase(i, { hourlyMult: v || 0 })} /></label>
                  </div>
                </div>
              ))}
            </div>
          </Section>

          {/* Global config */}
          <Section title="Konfigurasi global">
            <div className="space-y-3">
              <Field label="USD → IDR"><NumInput value={config.usd_to_idr} step={100} onChange={(v) => setCfg({ usd_to_idr: v || 0 })} /></Field>
              <Field label="Base hourly rate (IDR)"><NumInput value={config.base_hourly_rate_idr} step={5000} onChange={(v) => setCfg({ base_hourly_rate_idr: v || 0 })} /></Field>
              <Field label="Maks image per paket (mode campaign)"><NumInput value={config.campaign_package_size} min={1} onChange={(v) => setCfg({ campaign_package_size: v === "" ? 1 : Math.max(1, Math.floor(v)) })} /></Field>
              <button onClick={resetConfig} className="w-full rounded-md border border-slate-300 py-1.5 text-xs text-slate-500 hover:bg-slate-50">Reset ke default</button>
            </div>
          </Section>
        </div>

        {/* ---------------- OUTPUTS ---------------- */}
        <div className="space-y-5">
          {/* Total block */}
          <div className="rounded-xl border border-slate-200 bg-white p-5">
            <h2 className="mb-3 text-sm font-semibold text-slate-500">Total biaya internal · skenario average · {headerSetup}</h2>
            <div className="text-4xl font-extrabold tabular-nums text-slate-800">{idr(avg.total_internal)}</div>
            <div className="mt-1 text-xs text-slate-400">Range: {idr(results.min.total_internal)} – {idr(results.max.total_internal)}</div>

            <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div className="rounded-lg border border-slate-200 bg-white p-4">
                <div className="text-xs font-medium text-slate-500">Cost per {unitLabel}</div>
                <div className="mt-1 text-2xl font-bold tabular-nums text-slate-800">{idr(avg.cost_per_unit)}</div>
                <div className="mt-0.5 text-xs text-slate-400">total ÷ {rt.N}</div>
              </div>

              <div className="rounded-lg border border-dashed border-amber-300 bg-amber-50 p-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-medium text-amber-700">Buffered</span>
                  <div className="flex items-center gap-1">
                    <span className="text-xs text-amber-700">×</span>
                    <input type="number" step="0.05" min="0" value={config.price_buffer_multiplier}
                      onChange={(e) => setCfg({ price_buffer_multiplier: e.target.value === "" ? 0 : Number(e.target.value) })}
                      className="num-input w-16 rounded border border-amber-300 bg-white px-2 py-1 text-xs text-right font-semibold text-amber-800 outline-none" />
                  </div>
                </div>
                <div className="mt-1 text-2xl font-bold tabular-nums text-amber-800">{idr(avg.total_internal * buffer)}</div>
                <div className="mt-0.5 text-xs text-amber-600/70">bukan biaya internal aktual</div>
              </div>
            </div>
          </div>

          {/* Breakdown */}
          <div className="rounded-xl border border-slate-200 bg-white p-5">
            <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
              <h2 className="text-sm font-semibold text-slate-500">Breakdown fase</h2>
              <div className="flex items-center gap-2 text-xs">
                <select value={bdScenario} onChange={(e) => setBdScenario(e.target.value)} className="rounded border border-slate-300 px-2 py-1">
                  <option value="min">Min</option><option value="avg">Average</option><option value="max">Max</option>
                </select>
                <button onClick={() => setSortByPct(!sortByPct)} className="rounded border border-slate-300 px-2 py-1 text-slate-500">{sortByPct ? "↓ % total" : "urut asli"}</button>
              </div>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs tabular-nums">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-400">
                    <th className="py-1.5 text-left font-medium">Fase</th>
                    <th className="text-left font-medium">Scope</th>
                    <th className="font-medium">Generates</th>
                    <th className="font-medium">Machine</th>
                    <th className="font-medium">Jam</th>
                    <th className="font-medium">Labor</th>
                    <th className="font-medium">Subtotal</th>
                    <th className="font-medium">% total</th>
                  </tr>
                </thead>
                <tbody>
                  {bdRows.map((p) => { const b = bucketBadge(p); return (
                    <tr key={p.id} className="border-b border-slate-50">
                      <td className="py-1.5 text-left font-medium text-slate-700">{p.name}</td>
                      <td className="text-left"><span className={"rounded px-1.5 py-0.5 text-[10px] " + b.cls}>{b.txt}</span></td>
                      <td>{p.gen ? Math.round(p.gen).toLocaleString("id-ID") : "—"}</td>
                      <td>{p.machine ? idr(p.machine) : "—"}</td>
                      <td>{p.hrs || "—"}</td>
                      <td>{p.labor ? idr(p.labor) : "—"}</td>
                      <td className="font-semibold text-slate-700">{idr(p.scaledSubtotal)}</td>
                      <td>
                        <div className="flex items-center justify-end gap-1">
                          <span>{pct(p.pctOfTotal)}</span>
                          <span className="h-1.5 w-10 overflow-hidden rounded bg-slate-100"><span className="block h-full bg-indigo-400" style={{ width: (p.pctOfTotal * 100) + "%" }} /></span>
                        </div>
                      </td>
                    </tr>
                  ); })}
                </tbody>
                <tfoot>
                  <tr className="border-t-2 border-slate-200 font-bold text-slate-800">
                    <td className="py-2 text-left" colSpan="3">TOTAL INTERNAL ({rt.N} {unitLabel})</td>
                    <td>{idr(bdResult.total_machine)}</td>
                    <td></td>
                    <td>{idr(bdResult.total_labor)}</td>
                    <td>{idr(bdResult.total_internal)}</td>
                    <td>100%</td>
                  </tr>
                </tfoot>
              </table>
            </div>
            <p className="mt-2 text-[11px] text-slate-400">
              {upscaleOnly
                ? "Mode upscale only: hanya fase Touch Up/Upscale, dihitung per gambar."
                : campaignMode
                  ? `Mode campaign: Creative & Concept dihitung per paket (×${avg.packages}); Prompting per image (×${rt.N}); Touch Up/Upscale per Hires (×${avg.hiresN}).`
                  : `Mode per-visual: hanya Prompting Day per image (×${rt.N}) + Touch Up/Upscale per Hires (×${avg.hiresN}), termasuk labor cost keduanya. Creative Conception & Concept Revision tidak dihitung.`}
            </p>
          </div>

          {/* Split summary */}
          <div className="rounded-xl border border-slate-200 bg-white p-5">
            <h2 className="mb-3 text-sm font-semibold text-slate-500">Komposisi biaya (average)</h2>
            <div className="space-y-4">
              <div>
                <div className="mb-1 text-xs font-medium text-slate-600">Mesin vs Tenaga kerja</div>
                <Bar a={avg.total_machine} b={avg.total_labor} aLabel="Machine" bLabel="Labor" aColor="bg-indigo-500" bColor="bg-slate-400" />
              </div>
              {campaignMode && (
                <div>
                  <div className="mb-1 text-xs font-medium text-slate-600">Per paket vs Per-image</div>
                  <Bar a={avg.packagePart} b={avg.perImagePart} aLabel={`Paket (×${avg.packages})`} bLabel="Per-image" aColor="bg-amber-500" bColor="bg-teal-500" />
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      <footer className="mt-8 text-center text-[11px] text-slate-400">v1 · biaya internal saja · konfigurasi tersimpan di browser (localStorage)</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
